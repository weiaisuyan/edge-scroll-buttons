<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shot.css">
<style>
  .shotwrap {
    position: absolute; right: 0; top: 0; height: 100%; width: 60%; overflow: hidden;
    border-radius: 24px 0 0 24px;
    box-shadow: -16px 0 54px rgba(38, 52, 78, .18);
  }
  .shotwrap img { width: 100%; height: 100%; object-fit: cover; object-position: right center; display: block; }
  .shotwrap::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 40px;
    background: linear-gradient(90deg, rgba(243, 245, 248, .96), rgba(243, 245, 248, 0));
  }
  .panel { position: absolute; left: 76px; top: 0; height: 100%; width: 450px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 44px; height: 44px; display: block; border-radius: 10px; box-shadow: 0 4px 12px rgba(35, 45, 70, .18); }
  .brand .name { font-size: 19px; font-weight: 600; letter-spacing: .02em; }
  .brand .tag { font-size: 12px; color: #8a93a3; border: 1px solid #dfe4ec; border-radius: 999px; padding: 3px 10px; margin-left: 2px; }
  .bullets { display: flex; flex-direction: column; gap: 10px; margin-top: 2px; }
  .bullets div { font-size: 15.5px; color: #444d5c; display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, #7d94ad, #a88d63); flex: 0 0 auto; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="shotwrap"><img src="raw/esb_raw_hero1.png"></div>
    <div class="panel">
      <div class="brand"><img src="raw/icon.png"><span class="name">滚动按钮</span><span class="tag">Edge 扩展</span></div>
      <h1>网页滚动<br><span class="accent">一键到位</span></h1>
      <p class="sub">页面上悬浮的「上 / 下」按钮 ——<br>单击翻页 · 按住连续滚动 · 右键直达顶部 / 底部</p>
      <div class="bullets">
        <div><span class="dot"></span>36 款精美样式 · 6 大分类（含呼吸灯 / 流光）</div>
        <div><span class="dot"></span>可按网站排除，一键清净</div>
        <div><span class="dot"></span>闲置自动变淡，绝不挡视线</div>
      </div>
      <div class="chips"><span>单击翻页</span><span>按住连滚</span><span>右键到顶/到底</span><span>36 款样式</span></div>
    </div>
  </div>
</body>
</html>
