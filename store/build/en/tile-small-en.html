<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  .tile {
    position: relative; width: 440px; height: 280px; overflow: hidden;
    background: linear-gradient(135deg, #4c5a6e, #38424f 62%, #2f3743);
    color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 30px;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(46px); }
  .g1 { width: 240px; height: 240px; left: -70px; top: -90px; background: rgba(125, 160, 215, .5); }
  .g2 { width: 220px; height: 220px; right: -60px; bottom: -100px; background: rgba(255, 170, 110, .38); }
  .left { position: relative; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .row img { width: 58px; height: 58px; border-radius: 13px; box-shadow: 0 8px 22px rgba(10, 15, 25, .45); }
  .name { font-size: 23px; font-weight: 700; letter-spacing: .01em; }
  .tag { font-size: 13px; color: rgba(233, 239, 248, .85); line-height: 1.7; }
  .tag b { color: #fff; font-weight: 600; }
  .cluster { position: relative; display: grid; grid-template-columns: repeat(3, 40px); gap: 13px; padding-right: 2px; }
  .b { width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 6px 14px rgba(10, 15, 25, .4); }
</style>
</head>
<body>
  <div class="tile">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="left">
      <div class="row">
        <img src="../raw/icon.png">
        <div class="name">Scroll Buttons</div>
      </div>
      <div class="tag"><b>Scroll at your fingertips</b><br>36 styles · 6 families</div>
    </div>
    <div class="cluster">
      <div class="b" style="background:linear-gradient(140deg,#6b849f,#7b6d97)"></div>
      <div class="b" style="background:linear-gradient(120deg,#22c8a8,#3b82f6 38%,#8b5cf6 68%,#22d3ee)"></div>
      <div class="b" style="background:linear-gradient(140deg,#ff2ea6,#7b2eff 52%,#00c8ff)"></div>
      <div class="b" style="background:linear-gradient(120deg,#a5b4fc,#e9a8ff 22%,#ffc2dd 40%,#b5f0d8 58%,#9fd4ff 78%,#c9b3ff)"></div>
      <div class="b" style="background:linear-gradient(160deg,#0b3ad0,#002fa7 55%,#00248a)"></div>
      <div class="b" style="background:linear-gradient(140deg,#ffd97a,#ffb45c 45%,#ff8f6b)"></div>
    </div>
  </div>
</body>
</html>
