<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  .tile {
    position: relative; width: 1400px; height: 560px; overflow: hidden;
    background: linear-gradient(130deg, #4e5d72, #38424f 58%, #2e3642);
    color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(80px); }
  .g1 { width: 520px; height: 520px; left: -140px; top: -220px; background: rgba(125, 160, 215, .5); }
  .g2 { width: 480px; height: 480px; right: -120px; bottom: -240px; background: rgba(255, 170, 110, .36); }
  .g3 { width: 380px; height: 380px; right: 320px; top: -180px; background: rgba(160, 130, 220, .32); }
  .left { display: flex; align-items: center; gap: 34px; position: relative; }
  .left img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 14px 40px rgba(8, 12, 20, .5); }
  .name { font-size: 44px; font-weight: 700; letter-spacing: .01em; }
  .tag { font-size: 20px; color: rgba(233, 239, 248, .85); margin-top: 12px; line-height: 1.6; }
  .right { position: relative; display: grid; grid-template-columns: repeat(3, auto); gap: 26px 30px; align-items: center; }
  .b { width: 88px; height: 88px; border-radius: 50%; box-shadow: 0 12px 30px rgba(8, 12, 20, .48); }
</style>
</head>
<body>
  <div class="tile">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="glow g3"></div>
    <div class="left">
      <img src="../raw/icon.png">
      <div>
        <div class="name">Scroll Buttons</div>
        <div class="tag">Scrolling, one click away<br>Click to flip · hold to scroll · right-click for top/bottom</div>
      </div>
    </div>
    <div class="right">
      <div class="b" style="background:linear-gradient(140deg,#6b849f,#7b6d97)"></div>
      <div class="b" style="background:linear-gradient(120deg,#22c8a8,#3b82f6 38%,#8b5cf6 68%,#22d3ee)"></div>
      <div class="b" style="background:linear-gradient(140deg,#ff2ea6,#7b2eff 52%,#00c8ff)"></div>
      <div class="b" style="background:linear-gradient(120deg,#a5b4fc,#e9a8ff 22%,#ffc2dd 40%,#b5f0d8 58%,#9fd4ff 78%,#c9b3ff)"></div>
      <div class="b" style="background:linear-gradient(160deg,#0b3ad0,#002fa7 55%,#00248a)"></div>
      <div class="b" style="background:linear-gradient(140deg,#ffb03a,#f4572e 55%,#d22d47)"></div>
    </div>
  </div>
</body>
</html>
