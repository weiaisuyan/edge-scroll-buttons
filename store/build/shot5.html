<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shot.css">
<style>
  .head { position: absolute; left: 76px; top: 52px; }
  .head .sub { margin-top: 12px; }
  .left { position: absolute; left: 76px; top: 196px; width: 546px; }
  .left img { width: 100%; display: block; border-radius: 14px; border: 1px solid #edf0f5; }
  .cap { margin-top: 10px; font-size: 12.5px; color: #98a1af; }
  .right { position: absolute; right: 76px; top: 186px; width: 528px; display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; align-items: center; gap: 13px; padding: 13px 18px; }
  .item .k { font-size: 14.5px; font-weight: 600; flex: 0 0 158px; }
  .item .v { font-size: 13px; color: #6b7484; line-height: 1.55; }
  .item .ico { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(140deg, #eef2f7, #e3e9f1); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .item .ico svg { width: 17px; height: 17px; stroke: #5f7285; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="head">
      <h1>每个细节，<span class="accent">都能按你的习惯调</span></h1>
      <p class="sub">设置自动保存、即时生效；设置只存在本机，随时可一键备份恢复</p>
    </div>
    <div class="left card" style="padding:14px;">
      <img src="raw/esb_raw_clip_behavior.png">
      <div class="cap">设置页 · 滚动行为（翻页幅度 / 各段速度 / 按住参数）</div>
    </div>
    <div class="right">
      <div class="item card"><div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg></div><div><div class="k">翻页幅度</div><div class="v">10% – 100%，默认刚好一屏的 80%</div></div></div>
      <div class="item card"><div class="ico"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M8 19v-9M12 19V8M16 19v-6M20 19V4"/></svg></div><div><div class="k">速度全可调</div><div class="v">翻页 / 到顶到底 0.5–10×，按住滚动 200–3000 px/秒</div></div></div>
      <div class="item card"><div class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 12h6M12 9v6"/></svg></div><div><div class="k">外观与位置</div><div class="v">36 款样式 · 6 大分类 · 圆形 / 圆角 · 大小、透明度自由调</div></div></div>
      <div class="item card"><div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/></svg></div><div><div class="k">网站排除</div><div class="v">不想看到按钮的站点，加进名单即可（含子域名）</div></div></div>
      <div class="item card"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg></div><div><div class="k">备份与恢复</div><div class="v">导出设置文件，重装浏览器一导入就还原</div></div></div>
      <div class="item card"><div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg></div><div><div class="k">反馈直通</div><div class="v">设置页内置反馈入口，建议直达开发者邮箱</div></div></div>
    </div>
  </div>
</body>
</html>
